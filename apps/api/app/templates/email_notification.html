<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{SUBJECT}}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fef8ee;
            color: #303030;
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #fef8ee;
        }

        .card {
            background-color: #f2e9da;
            border: 1px solid #303030;
            border-radius: 10px;
            padding: 32px;
            box-shadow: 0 4px 10px 0 rgba(0, 0, 0, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo {
            color: #ffac00;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            color: #232323;
            margin-top: 24px;
            margin-bottom: 16px;
            border-bottom: 1px solid #303030;
            padding-bottom: 8px;
        }

        .content {
            font-size: 16px;
            color: #303030;
        }

        .footer {
            margin-top: 32px;
            text-align: center;
            font-size: 12px;
            color: #666;
            border-top: 1px solid #303030;
            padding-top: 16px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo">FileEaters</div>
        </div>
        <div class="card">
            <div class="title">{{SUBJECT}}</div>
            <div class="content">
                {{CONTENT}}
            </div>
            <div class="footer">
                This is an automated notification from FileEaters Enterprise.<br>
                Please do not reply to this email.
            </div>
        </div>
    </div>
</body>

</html>
